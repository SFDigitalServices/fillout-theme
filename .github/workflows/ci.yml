name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write # auto shipit: tags, releases
      pull-requests: write # auto shipit: PR comments for canary
      id-token: write # npm trusted publishing
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: npm

      - run: npm ci --ignore-scripts
      - run: npm run lint

      - run: npm run build
        env:
          NODE_ENV: production

      - run: npx publint

      - run: npx auto shipit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_LOGLEVEL: verbose # temporary: surfaces npm's OIDC exchange errors
